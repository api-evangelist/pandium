description: >-
  Pandium publishes no API rate limits. The full API reference (fetched 2026-09-03) contains no
  mention of rate limiting, no 429 responses, and no X-RateLimit-*/RateLimit-*/Retry-After
  headers, and no separate limits page exists in the docs. This replaces the 2026-05-04 scaffold,
  whose per-tier quotas and header names were placeholder defaults, not provider-published
  values. The only published throughput numbers are plan-level platform quotas — 50,000 daily
  integration executions on Lite, unlimited on Pro (see plans/pandium-plans-pricing.yml) — which
  govern integration runs, not API request rates. An honest zero: consumers get no documented
  runtime signal for backoff.
