  project (pypi.org/simple/pandium/ 404, probed 2026-09-03). The first-party tooling that does
  exist is distributed inside the product: the Pandium CLI is a platform-gated binary download
  from the Admin Dashboard, and the @pandium/[connector]-client libraries are injected into a
  customer's generated integration repository by Pandium's code generation rather than published
  to npm. Both are recorded below with version null — checked, nothing publishable to read.
