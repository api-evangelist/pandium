  /v2/integrations/{integration_id}/sync:
    post:
      summary: Sync By Integration Id
      description: 'Request a sync for an existing tenant based on an integration ID and a user name.

        For this to work, the user must have installed the integration via the Pandium

        In-App Marketplace, which creates a tenant associated with that user''s username. To sync a tenant created in the Pandium Integration Hub, use the sync by tenant id endpoint.'
      operationId: sync_by_integration_id_v2_integrations__integration_id__sync_post
      parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: integer
          description: Unique identifier for an integration
          title: Integration Id
        description: Unique identifier for an integration
      - name: mode
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/V2RunMode'
          description: must be one of 'init' or 'normal'
        description: must be one of 'init' or 'normal'
      - name: user_name
        in: query
        required: true
        schema:
          type: string
          description: must correspond to the user id sent from your system to the Pandium In-App Marketplace when the user installed this integration
          title: User Name
        description: must correspond to the user id sent from your system to the Pandium In-App Marketplace when the user installed this integration
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                additionalProperties: true
              - type: 'null'
              description: fields determined by the integration
              title: Body
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trigger'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Unprocessable Content
      tags:
      - Integrations
    servers:
    - url: https://api.pandium.io
      description: Production
    - url: https://api.sandbox.pandium.com
      description: Sandbox
