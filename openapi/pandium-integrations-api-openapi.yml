openapi: 3.2.0
info:
  title: Pandium Integrations API
  version: 2.0.0
  contact:
    name: Pandium
    url: https://www.pandium.com/
  termsOfService: https://www.pandium.com/terms-and-conditions
  description: 'Operations tagged Integrations across 2 of this provider''s published API definitions: pandium-api-docs-openapi.yml, pandium-pandium-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.pandium.io
  description: Production
- url: https://api.sandbox.pandium.com
  description: Sandbox
security:
- apiKey: []
tags:
- name: Integrations
paths:
  /v2/integrations:
    get:
      summary: Get Many Integrations
      description: Get all your integrations on Pandium.
      operationId: get_many_integrations_v2_integrations_get
      parameters:
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: format is {field}__ASC or {field}__DESC
          title: Sort By
        description: format is {field}__ASC or {field}__DESC
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: default is 100, max is 500
          default: 100
          title: Limit
        description: default is 100, max is 500
      - name: skip
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'paging support: this is the number of records to skip. Normally you want page_number*limit. default is 0'
          default: 0
          title: Skip
        description: 'paging support: this is the number of records to skip. Normally you want page_number*limit. default is 0'
      - name: archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: set this to true to fetch archived integrations
          default: false
          title: Archived
        description: set this to true to fetch archived integrations
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/external_api_v1__v2schemas__Integration'
                title: Response Get Many Integrations V2 Integrations Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Integrations
    servers:
    - url: https://api.pandium.io
      description: Production
    - url: https://api.sandbox.pandium.com
      description: Sandbox
