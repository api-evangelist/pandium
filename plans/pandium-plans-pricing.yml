description: >-
  Pandium's published plans, read from the public pricing page (fetched 2026-09-03). This
  replaces the 2026-05-04 scaffold, whose tier limits were placeholder defaults. Pandium
  publishes two paid tiers with transparent entry pricing — there is no free tier and no
  self-serve trial; onboarding runs through a demo/sales conversation. A tenant is defined as a
  single customer's installed and configured copy of an integration, tied to that customer's own
  credentials and settings.
